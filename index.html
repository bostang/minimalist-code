<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Minimalist Code</title>
  <meta name="description" content="A lightweight in-browser code editor with a VS Code-like experience: syntax highlighting, document formatting and familiar keyboard shortcuts." />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#1e1e1e" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <!-- Apply the saved (or OS) theme before first paint. Mirrors src/theme.js. -->
  <script>
    (function () {
      var theme = null;
      try { theme = localStorage.getItem('minimalist-code.theme'); } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', theme);
      if (theme === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#ffffff');
    })();
  </script>
  <style>
    :root {
      color-scheme: dark;
      --app-bg: #1e1e1e;
      --app-fg: #cccccc;
      --statusbar-bg: #007acc;
      --statusbar-fg: #ffffff;
      --statusbar-hover: rgba(255, 255, 255, 0.15);
      --statusbar-error-bg: #c72e0f;
      --menu-bg: #252526;
      --menu-fg: #cccccc;
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --app-bg: #fffffe;
      --app-fg: #333333;
      --menu-bg: #f3f3f3;
      --menu-fg: #333333;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--app-bg);
      color: var(--app-fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    #editor {
      flex: 1;
      min-height: 0;
      width: 100%;
      overflow: hidden;
    }
    #statusbar {
      height: 22px;
      flex-shrink: 0;
      background: var(--statusbar-bg);
      color: var(--statusbar-fg);
      display: flex;
      align-items: stretch;
      padding: 0 7px;
      font-size: 12px;
      user-select: none;
    }
    #status-message {
      margin-right: auto;
      min-width: 0;
      padding: 0 5px;
      display: flex;
      align-items: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #status-message:empty { padding: 0; }
    #status-message.is-error { background: var(--statusbar-error-bg); }
    .statusbar-item {
      background: transparent;
      color: inherit;
      border: none;
      border-radius: 0;
      font: inherit;
      cursor: pointer;
      padding: 0 5px;
      display: flex;
      align-items: center;
    }
    .statusbar-item:hover { background: var(--statusbar-hover); }
    .statusbar-item:focus { outline: none; }
    .statusbar-item:focus-visible {
      outline: 1px solid var(--statusbar-fg);
      outline-offset: -1px;
    }
    #lang-select option {
      background: var(--menu-bg);
      color: var(--menu-fg);
    }
    .icon {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    /* Show the theme the button switches to. */
    :root[data-theme="dark"] .icon-moon,
    :root[data-theme="light"] .icon-sun { display: none; }
    .fatal-error {
      padding: 16px;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <noscript><p class="fatal-error">Minimalist Code needs JavaScript to run.</p></noscript>
  <main id="editor"></main>
  <footer id="statusbar">
    <span id="status-message" role="status" aria-live="polite"></span>
    <select id="lang-select" class="statusbar-item" title="Select Language Mode" aria-label="Language mode"></select>
    <button id="theme-toggle" class="statusbar-item" type="button" title="Toggle color theme" aria-label="Toggle color theme">
      <svg class="icon icon-sun" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
        <circle cx="8" cy="8" r="3" />
        <path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1.06 1.06M11.54 11.54l1.06 1.06M3.4 12.6l1.06-1.06M11.54 4.46l1.06-1.06" />
      </svg>
      <svg class="icon icon-moon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
        <path d="M13.5 10.1A6 6 0 0 1 5.9 2.5a6 6 0 1 0 7.6 7.6z" />
      </svg>
    </button>
  </footer>
  <script type="module" src="/index.js"></script>
</body>
</html>
